[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bgroundremover"
version = "0.1.0"
description = "Professional AI Background Removal Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
  { name = "Siraj" }
]

keywords = [
  "background-removal",
  "ai",
  "image",
  "segmentation",
  "birefnet"
]

classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

dependencies = []

[project.scripts]
bground = "bground:main"
